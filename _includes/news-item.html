<div class="row">
  <span class="meta">{{ include.item.date | date: "%B %-d, %Y" }}</span>
  <span class="row-body">
    <span class="row-title">{{ include.item.title }}</span>
    {{ include.item.text }}
    {% if include.item.url %}<a href="{{ include.item.url }}" target="_blank" rel="noreferrer">Read more →</a>{% endif %}
  </span>
</div>
