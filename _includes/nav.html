<header class="site-header">
  <div class="site-top">
    <div class="brand">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
    <img src="{{ '/assets/img/young_header.png' | relative_url }}" alt="" class="site-header-img">
  </div>
  <nav class="site-nav" aria-label="Main">
    {% assign tabs = "Home,/,red|Research,/research/,orange|People,/people/,green|Publications,/publications/,navy|Join,/join/,blue" | split: "|" %}
    {% for t in tabs %}{% assign f = t | split: "," %}
    <a href="{{ f[1] | relative_url }}" class="tab tab-{{ f[2] }}"{% if page.url == f[1] %} aria-current="page"{% endif %}>{{ f[0] }}</a>
    {% endfor %}
  </nav>
</header>
